name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'byte5ai/omadia ref to build @omadia/plugin-api from'
        required: false
        default: 'main'

permissions:
  contents: read

# The `file:../odoo-bot/middleware/packages/plugin-api` dependency needs omadia
# core NEXT TO this repo. actions/checkout can only write inside the workspace,
# so BOTH repos are checked out into subdirectories of it and every step that
# touches this repo sets `working-directory`. Checking this repo out at the
# workspace root instead would put `../odoo-bot` outside the workspace, where
# checkout cannot place it.
#
# OMADIA_CORE_REF pins which core ref supplies `@omadia/plugin-api`. It is
# `main`, and `test/coreApiSurface.test.ts` is what keeps that honest: this
# package imports exactly two type names from core's contract package, both on
# `main` since long before epic #470, and the plugin context is declared
# structurally rather than imported. So the C6/C7 additions (`ctx.sql`, the
# route `auth`/`body` options) are describable here while those branches are
# still open, and nothing has to be vendored or marked TEMP.
#
# Override it to build against a contract branch:
#   gh workflow run ci.yml -f core_ref=feat/470-c6-session-auth-raw-body
env:
  SELF: omadia-dev-platform
  CORE: odoo-bot
  OMADIA_CORE_REF: ${{ inputs.core_ref || 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    # The Postgres suites need a real database and skip loudly without one. A
    # skipped suite that reads as a passing one is the failure this repo cannot
    # afford right after a 60-file port, so CI supplies the database rather than
    # accepting the skip. `pgvector` because core's base migrations create the
    # `vector` extension; a plain `postgres:16` answers the probe and then dies
    # on `CREATE EXTENSION vector`.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout omadia-dev-platform
        uses: actions/checkout@v4
        with:
          path: omadia-dev-platform

      # byte5ai/omadia is public, so the default GITHUB_TOKEN can read it.
      # Only plugin-api is ever built from this checkout — the rest of core is
      # not installed, not built and not tested here.
      - name: Checkout omadia core (sibling — provides @omadia/plugin-api)
        uses: actions/checkout@v4
        with:
          repository: byte5ai/omadia
          ref: ${{ env.OMADIA_CORE_REF }}
          path: odoo-bot

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `middleware/packages/plugin-api/dist/` is gitignored in core, and this
      # repo's tsconfig resolves the package through its emitted .d.ts — so the
      # sibling has to be built, not merely present.
      #
      # Two traps live in this step, both of which have already cost a red run:
      #
      #  1. `middleware/package.json` is an npm WORKSPACE ROOT (`packages/*`).
      #     An `npm install` run from inside `packages/plugin-api` is hijacked
      #     by it and installs to the workspace root instead, leaving
      #     `packages/plugin-api/node_modules` empty. Hence: install from
      #     `middleware` with `--no-workspaces`, which also stops npm from
      #     installing all of core's other packages.
      #  2. `npx tsc` does NOT fail when TypeScript is absent — it silently
      #     downloads the unrelated `tsc` package from npm (an abandoned
      #     placeholder) and exits 1 with a confusing message. Always invoke the
      #     compiler by explicit path.
      #
      # plugin-api has no dependencies of its own: typescript + @types/node are
      # the whole toolchain, which is why core's middleware is never installed.
      - name: Build @omadia/plugin-api from the sibling checkout
        working-directory: odoo-bot/middleware
        run: |
          npm install --ignore-scripts --no-save --no-package-lock --no-workspaces \
            typescript@^6.0.2 @types/node@^25.6.0
          ./node_modules/.bin/tsc -p packages/plugin-api
          test -f packages/plugin-api/dist/index.d.ts

      - name: Install
        working-directory: omadia-dev-platform
        run: npm ci

      - name: Typecheck
        working-directory: omadia-dev-platform
        run: npm run typecheck

      - name: Build
        working-directory: omadia-dev-platform
        run: npm run build

      # OMADIA_CORE_DIR points the test bootstrap at the sibling checkout for
      # core's base migrations 0001-0021: this plugin's tables reference them,
      # so a bare database cannot run its schema at all. The plugin's own nine
      # are then applied from the SHIPPED `.js` artifacts, so the pg suites
      # exercise what the ZIP contains.
      #
      # With a database configured the runner switches to --test-concurrency=1:
      # several suites drive a real DevJobWorker claim loop and, run in
      # parallel against one database, claim each other's jobs.
      - name: Test
        working-directory: omadia-dev-platform
        env:
          GRAPH_PG_TEST_URL: postgres://test:test@127.0.0.1:55438/test
          OMADIA_CORE_DIR: ${{ github.workspace }}/odoo-bot
        run: npm test

      # A green suite with every pg case skipped is not a green suite. Fail the
      # run if the database CI just provisioned was not actually reached.
      - name: Assert the Postgres suites actually ran
        working-directory: omadia-dev-platform
        env:
          GRAPH_PG_TEST_URL: postgres://test:test@127.0.0.1:55438/test
          OMADIA_CORE_DIR: ${{ github.workspace }}/odoo-bot
        run: |
          npm test -- devJobStore.pg 2>&1 | tee /tmp/pg-probe.log
          grep -qE '^# pass [1-9]' /tmp/pg-probe.log
          if grep -qi 'skipping' /tmp/pg-probe.log; then
            echo "::error::the Postgres suites skipped — the service container was not reachable"
            exit 1
          fi

      # The SPA vocabulary gate.
      #
      # `npm run build -w packages/ui` already runs this check — it is the
      # second half of that package’s `build` script. Running it again,
      # standalone, catches the one edit the build itself cannot see: a
      # `vocabulary/classes.txt` widened by hand to turn a red build green.
      # That passes either way inside the build; here it is the only subject.
      #
      # A class outside the served sheet does not error at runtime. It renders
      # UNSTYLED, on the operator’s screen, and nowhere else.
      - name: Assert the plugin UI vocabulary
        working-directory: omadia-dev-platform/packages/ui
        run: npm run lint:vocabulary

      - name: Package
        working-directory: omadia-dev-platform
        run: npm run package -w packages/plugin

      # `ui/` is in build-zip’s REQUIRED_DIRS, so a missing bundle already
      # fails the step above. This asserts the property that step cannot: that
      # the archive carries NO stylesheet. `.css` is absent from the plugin-ZIP
      # extension allowlist, so a ZIP containing one is rejected at ingest —
      # after upload, by someone else, with a message that does not name this
      # build. `set -o pipefail` because a `grep` behind a pipe that dies on a
      # 64 KiB buffer is how this repo’s sibling shipped a dead release
      # pipeline for months.
      - name: Assert the ZIP ships a bundle and no stylesheet
        working-directory: omadia-dev-platform
        shell: bash
        run: |
          set -euo pipefail
          # Exactly one, not `ls *.zip` — a stale artifact from an earlier
          # version makes that glob expand to two paths and `unzip` then
          # reads the second as an archive member filter, which SUCCEEDS while
          # inspecting nothing. A green step that checked no file is the exact
          # failure this step exists to prevent.
          shopt -s nullglob
          zips=(packages/plugin/out/*.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "::error::expected exactly one ZIP, found ${#zips[@]}: ${zips[*]}"
            exit 1
          fi
          zip="${zips[0]}"
          unzip -l "$zip" > /tmp/zip-list.txt
          grep -q "ui/index.html" /tmp/zip-list.txt
          if grep -qE "[.]css$" /tmp/zip-list.txt; then
            echo "::error::the plugin ZIP contains a stylesheet - plugins ship no CSS"
            exit 1
          fi

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: omadia-dev-platform-zip
          path: omadia-dev-platform/packages/plugin/out/*.zip
          if-no-files-found: error
